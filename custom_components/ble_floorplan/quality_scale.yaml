# Integration quality scale, checked against the rules of Home Assistant 2026.11.
# hassfest only validates this file for core integrations; it documents the
# state of this custom integration rule by rule, and tests/test_quality_scale.py
# fails while a rule is missing or not done.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions; the page uses WebSocket commands, see README.
  appropriate-polling:
    status: done
    comment: >-
      Positions are computed once a second from the advertisements Home
      Assistant's Bluetooth stack holds in memory, no device is asked; Active
      scanners is polled every 30 s, because a quiet scanner changes nothing.
  brands:
    status: done
    comment: Brand images ship in brand/.
  common-modules:
    status: done
    comment: coordinator.py and entity.py (shared tracker entity and device).
  config-flow:
    status: done
    comment: The flow has no fields; everything is set on the page.
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No requirements.
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-conditions:
    status: exempt
    comment: No conditions of its own; automations use the state of its entities.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: Coordinator entities subscribe in async_added_to_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Nothing to connect to; the scanners belong to the Bluetooth integration.
  test-before-setup:
    status: done
    comment: A stored file that cannot be read stops the setup with ConfigEntryError.
  unique-config-entry:
    status: done
    comment: single_config_entry.

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions; the WebSocket commands return error codes.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: The option and every setting of the page are described in the README.
  docs-installation-parameters:
    status: exempt
    comment: The config flow asks for nothing.
  entity-unavailable:
    status: done
    comment: >-
      The coordinator makes the entities unavailable when an update fails; a
      tracker no scanner hears is unknown (room) or not_home (presence).
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The coordinator logs a failed update once and its recovery once.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No credentials.
  test-coverage:
    status: done
    comment: CI fails below 100 %.

  # Gold
  devices:
    status: done
    comment: One device per tracker and the BLE Floorplan device for Active scanners.
  diagnostics:
    status: done
    comment: Without names, addresses, device ids, rooms, areas or the timeline.
  discovery:
    status: exempt
    comment: Scanners and trackers belong to other integrations; the page offers them.
  discovery-update-info:
    status: exempt
    comment: Nothing to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment: Every Bluetooth scanner of Home Assistant; tags with a fixed address and Private BLE Devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-triggers:
    status: exempt
    comment: No triggers of its own; automations use the state of its entities (README, Examples).
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: A tracker added on the page gets its device and entities without a reload.
  entity-category:
    status: done
    comment: The position sensors are diagnostic.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: The position sensors, needed rarely, exist only with the option Position sensors.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The entry has no settings of its own; they are on the page.
  repair-issues:
    status: done
    comment: A tracker whose Private BLE Device was removed.
  stale-devices:
    status: done
    comment: A tracker taken off the plan loses its device at once.

  # Platinum
  async-dependency:
    status: exempt
    comment: No dependency.
  inject-websession:
    status: exempt
    comment: No HTTP client.
  strict-typing:
    status: done
    comment: mypy --strict runs in CI (mypy.ini).
