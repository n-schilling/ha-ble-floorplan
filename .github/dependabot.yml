version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Pinned to what Home Assistant pins (package_constraints, hassio manifest);
      # they move with homeassistant / pytest-homeassistant-custom-component, not on their own
      - dependency-name: aiohasupervisor
      - dependency-name: bleak
      - dependency-name: bleak-retry-connector
      - dependency-name: bluetooth-adapters
      - dependency-name: bluetooth-auto-recovery
      - dependency-name: bluetooth-data-tools
      - dependency-name: habluetooth
      - dependency-name: dbus-fast
      - dependency-name: aiousbwatcher
      - dependency-name: serialx
